name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64 (the appliance) and macOS on Apple Silicon (the desktop app)
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # private recordings (fixtures/local) are absent: those tests skip
      - run: cargo test --workspace

  speech:
    name: speech build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p railspotting-receiver --features speech
      # the desktop app's speech build: whisper.cpp on the GPU through Metal
      - if: runner.os == 'macOS'
        run: cargo build --release -p railspotting-receiver --features metal
