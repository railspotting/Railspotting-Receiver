[package]
name = "railspotting-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
log = "0.4.34"
num-complex = "0.4.6"
railspotting-common = { version = "2.0.0", path = "../common" }
railspotting-itc = { version = "2.0.0", path = "../itc" }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.26.1", features = ["v4", "v5"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
